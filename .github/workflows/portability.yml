name: Finite offline three-arm pilot
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: nexa-portability-one-at-a-time
  cancel-in-progress: false
jobs:
  portability:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Parcifalix00/bram-ring-prefetch-queue' &&
      github.event.repository.private == false &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch this exact public workflow revision without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Parcifalix00/bram-ring-prefetch-queue'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$RUNNER_OS" = 'Linux'
          test "$RUNNER_ARCH" = 'X64'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          test ! -e .git
          git init --quiet .
          git -c credential.helper= -c http.extraheader= fetch --quiet --depth=1 --no-tags \
            https://github.com/Parcifalix00/bram-ring-prefetch-queue.git "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run one finite offline three-arm correctness and comparison
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(sha256sum tools/portability_probe.py | cut -d ' ' -f1)" = 'cf29f1c9684c17841df705cfc789aaba2878d79fe3637bc304f84a99025ffcc7'
          python3 -B tools/portability_probe.py --run-approved-manual-pilot
